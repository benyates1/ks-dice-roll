<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Fate - Dice Roll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'off-black': '#080808',
                        'dark-grey': '#121212',
                        'dark-red': '#4a0000',
                        'blood-red': '#7a0000',
                        'crimson': '#b91c1c',
                        'soft-white': '#f3f4f6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #080808;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .dice-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
            perspective: 1000px;
        }

        @media (min-width: 768px) {
            .dice-container {
                width: 220px;
                height: 220px;
            }
        }

        .dice {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1f1f 0%, #0a0a0a 100%);
            border: 2px solid #4a0000;
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.05);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 1.5rem;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .dice:hover {
            box-shadow: 0 30px 60px rgba(74, 0, 0, 0.4), inset 0 0 20px rgba(255,255,255,0.08);
            transform: translateY(-5px) scale(1.02);
            border-color: #7a0000;
        }

        .dot {
            background-color: #b91c1c;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8), 0 0 12px rgba(185, 28, 28, 0.6);
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
            transform: scale(0.8);
        }

        .dot.active {
            opacity: 1;
            transform: scale(1);
        }

        .rolling {
            animation: rollShake 0.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes rollShake {
            0% { transform: rotate(0deg) scale(1.02); }
            25% { transform: rotate(-8deg) scale(1.02) translateY(-4px); }
            50% { transform: rotate(8deg) scale(1.02) translateY(4px); }
            75% { transform: rotate(-4deg) scale(1.02) translateY(-2px); }
            100% { transform: rotate(0deg) scale(1.02); }
        }

        .glow-text {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .glow-red {
            text-shadow: 0 0 20px rgba(185, 28, 28, 0.5);
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .dice-icon {
            font-size: 1.2em;
            line-height: 1;
            vertical-align: middle;
            display: inline-block;
            margin-bottom: 0.15em;
        }
    </style>
</head>
<body class="bg-off-black text-gray-200 antialiased select-none p-4 md:p-8" oncontextmenu="return false;" ondragstart="return false;">

    <div class="w-full max-w-7xl mx-auto flex flex-col items-center justify-center min-h-[85vh] relative bg-dark-grey bg-opacity-40 backdrop-blur-2xl rounded-[3rem] border border-gray-900 overflow-hidden shadow-2xl p-6 md:p-12">
        
        <!-- Ambient Background Lights -->
        <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-transparent via-crimson to-transparent opacity-50"></div>
        <div class="absolute -top-[30%] -left-[10%] w-[60%] h-[60%] bg-blood-red rounded-full mix-blend-screen filter blur-[150px] opacity-10 pointer-events-none"></div>
        <div class="absolute -bottom-[30%] -right-[10%] w-[60%] h-[60%] bg-dark-red rounded-full mix-blend-screen filter blur-[150px] opacity-10 pointer-events-none"></div>

        <div class="z-10 w-full flex flex-col items-center flex-grow justify-center text-center">
            
            <!-- Header for initial state -->
            <header id="main-header" class="mb-12 transition-opacity duration-500">
                <h1 class="text-2xl md:text-3xl font-semibold tracking-widest text-gray-500 uppercase mb-3">Daily Fate</h1>
                <p class="text-gray-400" id="status-text">Click to seal your destiny.</p>
            </header>

            <!-- Dice Wrapper -->
            <div id="dice-wrapper" class="w-full flex justify-center transition-all duration-500">
                <div class="dice-container">
                    <div id="dice" class="dice" onclick="rollDice()">
                        <div class="dot" id="dot-1"></div>
                        <div class="dot" id="dot-2"></div>
                        <div class="dot" id="dot-3"></div>
                        <div class="dot" id="dot-4"></div>
                        <div class="dot" id="dot-5"></div>
                        <div class="dot" id="dot-6"></div>
                        <div class="dot" id="dot-7"></div>
                        <div class="dot" id="dot-8"></div>
                        <div class="dot" id="dot-9"></div>
                    </div>
                </div>
            </div>

            <!-- Result Display (Hidden initially, Main Focus) -->
            <div id="result-wrapper" class="hidden flex-col items-center justify-center w-full max-w-5xl">
                
                <!-- Massive Task Text -->
                <h2 id="result-message" class="text-5xl md:text-7xl lg:text-[6.5rem] font-black text-soft-white leading-tight md:leading-tight mb-12 glow-text px-4 text-balance">
                    <!-- Task injected here -->
                </h2>

                <!-- Secondary Info Wrapper -->
                <div class="flex flex-col items-center space-y-6 mt-4 md:mt-12 bg-black/30 p-8 rounded-3xl border border-gray-800/50 backdrop-blur-sm w-full max-w-md">
                    <!-- Roll Indicator -->
                    <div class="text-xl md:text-2xl font-medium text-gray-400 flex items-center justify-center gap-3">
                        <span>Your roll is</span>
                        <span id="roll-display" class="text-crimson font-bold flex items-center gap-2 bg-dark-red/10 px-4 py-2 rounded-xl border border-crimson/20 glow-red">
                            <span id="roll-icon" class="dice-icon">⚀</span> 
                            <span id="roll-number">1</span>
                        </span>
                    </div>

                    <!-- Divider -->
                    <div class="w-full h-px bg-gradient-to-r from-transparent via-gray-700 to-transparent"></div>

                    <!-- Cooldown Timer -->
                    <div class="flex flex-col items-center">
                        <span class="text-xs md:text-sm text-gray-500 uppercase tracking-widest mb-1 font-semibold">Available again in</span>
                        <div id="timer" class="text-lg md:text-xl font-mono text-gray-300">00:00:00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-8 text-center text-gray-600/80 text-sm font-medium tracking-wide max-w-md mx-auto">
        One roll permitted... you will not be able to roll again for 24 hours.
    </div>

    <script>
        // Configuration
        const COOLDOWN_HOURS = 24;
        const COOLDOWN_MS = COOLDOWN_HOURS * 60 * 60 * 1000;
        
        // Developer Toggle: Set to true to bypass the 24-hour wait period for testing
        const BYPASS_COOLDOWN = false;
        
        // Embedded JSON for roll outcomes
        const rollOutcomes = {
            "1": "Do 100 Pushups",
            "2": "Read 1 Chapter of a Book",
            "3": "No Social Media for 12 Hours",
            "4": "Drink 1 Gallon of Water",
            "5": "Meditate for 20 Minutes",
            "6": "Run 5 Kilometers"
        };

        // Unicode Dice Icons mapping
        const diceIcons = {
            1: '⚀', 2: '⚁', 3: '⚂', 4: '⚃', 5: '⚄', 6: '⚅'
        };

        // DOM Elements
        const headerEl = document.getElementById('main-header');
        const diceWrapper = document.getElementById('dice-wrapper');
        const diceEl = document.getElementById('dice');
        const dots = Array.from(document.querySelectorAll('.dot'));
        const statusText = document.getElementById('status-text');
        
        const resultWrapper = document.getElementById('result-wrapper');
        const resultMessageEl = document.getElementById('result-message');
        const rollIconEl = document.getElementById('roll-icon');
        const rollNumberEl = document.getElementById('roll-number');
        const timerEl = document.getElementById('timer');

        let rollInterval;
        let countdownInterval;
        let isRolling = false;

        // Dice face mappings (indices of the 3x3 grid)
        const diceFaces = {
            1: [4],
            2: [0, 8],
            3: [0, 4, 8],
            4: [0, 2, 6, 8],
            5: [0, 2, 4, 6, 8],
            6: [0, 2, 3, 5, 6, 8]
        };

        function init() {
            const storedData = localStorage.getItem('dailyFateRoll');
            
            if (storedData) {
                try {
                    const rollData = JSON.parse(storedData);
                    const timeSinceRoll = Date.now() - rollData.timestamp;
                    
                    // Bypass cooldown if BYPASS_COOLDOWN is true
                    if (timeSinceRoll < COOLDOWN_MS && !BYPASS_COOLDOWN) {
                        showCooldownUI(rollData.timestamp, rollData.number);
                        return;
                    } else {
                        localStorage.removeItem('dailyFateRoll');
                    }
                } catch(e) {
                    localStorage.removeItem('dailyFateRoll');
                }
            }
            
            showDiceUI();
        }

        function showDiceUI() {
            headerEl.classList.remove('hidden', 'opacity-0');
            diceWrapper.classList.remove('hidden', 'opacity-0');
            resultWrapper.classList.add('hidden');
            resultWrapper.classList.remove('flex', 'fade-enter-active');
            
            drawFace(6); // Default starting face
        }

        function showCooldownUI(lastRollTime, numberRolled) {
            // Hide the dice and header completely
            diceWrapper.classList.add('hidden', 'opacity-0');
            headerEl.classList.add('hidden', 'opacity-0');
            
            // Populate data
            resultMessageEl.innerText = rollOutcomes[numberRolled.toString()] || "Complete your duty.";
            rollIconEl.innerText = diceIcons[numberRolled];
            rollNumberEl.innerText = numberRolled;
            
            // Show result wrapper with flex layout
            resultWrapper.classList.remove('hidden');
            resultWrapper.classList.add('flex', 'fade-enter');
            
            // Trigger animation frame for CSS transition
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    resultWrapper.classList.add('fade-enter-active');
                });
            });
            
            startCountdown(lastRollTime);
        }

        function drawFace(number) {
            dots.forEach(dot => dot.classList.remove('active'));
            const activeIndices = diceFaces[number];
            if (activeIndices) {
                activeIndices.forEach(idx => {
                    dots[idx].classList.add('active');
                });
            }
        }

        function startCountdown(lastRollTime) {
            if (countdownInterval) clearInterval(countdownInterval);
            const targetTime = lastRollTime + COOLDOWN_MS;

            function update() {
                const now = Date.now();
                const diff = targetTime - now;

                if (diff <= 0) {
                    clearInterval(countdownInterval);
                    showDiceUI();
                    return;
                }

                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                timerEl.innerText = 
                    String(hours).padStart(2, '0') + ':' + 
                    String(minutes).padStart(2, '0') + ':' + 
                    String(seconds).padStart(2, '0');
            }

            update();
            countdownInterval = setInterval(update, 1000);
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;

            statusText.innerText = "Consulting the fates...";
            diceEl.classList.add('rolling');

            let iterations = 0;
            const maxIterations = 15; 
            
            // Fast switching of faces
            rollInterval = setInterval(() => {
                const randomFace = Math.floor(Math.random() * 6) + 1;
                drawFace(randomFace);
                iterations++;
                
                if (iterations >= maxIterations) {
                    clearInterval(rollInterval);
                    finishRoll();
                }
            }, 80);
        }

        function finishRoll() {
            diceEl.classList.remove('rolling');
            const finalNumber = Math.floor(Math.random() * 6) + 1;
            drawFace(finalNumber);
            
            const now = Date.now();
            localStorage.setItem('dailyFateRoll', JSON.stringify({
                timestamp: now,
                number: finalNumber
            }));
            
            // Hold on the final face for a second before revealing task
            setTimeout(() => {
                showCooldownUI(now, finalNumber);
                isRolling = false;
            }, 1000);
        }

        // Boot
        window.onload = init;
    </script>
</body>
</html>
